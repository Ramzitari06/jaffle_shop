sources:
  - name: jaffle_shop
    database: raw  
    schema: jaffle_shop
    description : a clone of a postgres application database.
    config: 
        freshness: 
          warn_after: 
            count: 6
            period: hour
          error_after: 
            count: 12
            period: hour
        loaded_at_field: _etl_loaded_at
    tables:
      - name: orders
        description : raw orders data.
        columns :
        - name: id
          description : pk order data.
          data_tests:
            - unique
            - not_null
      - name: customers
        description : raw customer data