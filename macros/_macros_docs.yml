macros:
  - name: cents_to_dollars
    description : A macro that convert  dollars tro cents and rounds to the uder input decimal places , or 2 if none is provided 
    arguments:
      - name: column_name
        type: string
        description: the name of the column you want to convert
      - name: decimals 
        type: integer
        description: number of decimal places , defaults to 2 